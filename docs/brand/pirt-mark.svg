<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">PIRT mark</title>
  <desc id="desc">A green rounded P containing a terminal chevron. The chevron starts at the right edge of the stem, is vertically aligned to the bowl interior, and opens through the bottom of the bowl.</desc>

  <!--
    Construction grid (1024 x 1024):
      stem:             x=224..352, y=176..848
      bowl exterior:    top=176, right=832, bottom=672
      bowl interior:    top=304, bottom=544
      shared midline:   y=424

    The knockout begins exactly at the stem's right edge (x=352): its
    64-unit round cap is centred at x=384, so it never cuts into the stem.
    Its tip lies on the bowl's rightmost-point midline (y=424).
    A vertical channel descends from the lower arm to y=704, beyond the
    bowl's bottom (y=672), so the knockout is topologically open.
  -->
  <defs>
    <mask id="terminal-cutout" maskUnits="userSpaceOnUse"
          x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white"/>
      <!-- Main chevron: tall enough to occupy the bowl instead of reading
           as a small, flat arrow. -->
      <path d="M384 272 L648 424 L384 576"
            fill="none" stroke="black" stroke-width="64"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- A narrower continuation opens only a small part of the bowl's
           lower edge. Keeping it separate avoids a heavy white pillar. -->
      <path d="M384 568 V696"
            fill="none" stroke="black" stroke-width="36"
            stroke-linecap="round"/>
    </mask>
  </defs>

  <path fill="#1F6547" mask="url(#terminal-cutout)"
        d="M256 176
           H584
           C721 176 832 287 832 424
           C832 561 721 672 584 672
           H352
           V816
           A32 32 0 0 1 320 848
           H256
           A32 32 0 0 1 224 816
           V208
           A32 32 0 0 1 256 176
           Z"/>
</svg>
